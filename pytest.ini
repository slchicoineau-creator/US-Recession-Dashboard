[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -ra --strict-markers --tb=short
markers =
    network: tests that hit external APIs (FRED/yfinance) — skip if keys/network unavailable
    slow: long-running tests
filterwarnings =
    ignore::DeprecationWarning
